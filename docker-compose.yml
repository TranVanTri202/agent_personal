version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: personal_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-personal_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_agent_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-personal_agent}
    ports:
      # Bind only to 127.0.0.1, default port 5433 to avoid conflict with existing host databases
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personal_agent} -d ${POSTGRES_DB:-personal_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: personal_agent_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      # Bind only to 127.0.0.1, default port 6380 to avoid conflict with existing host redis
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    name: personal_agent_postgres_data
  redis_data:
    name: personal_agent_redis_data
